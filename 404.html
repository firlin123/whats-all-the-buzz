<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's all the buzz about?</title>
  <meta name="description" content="What's all the buzz about?">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://whats-all-the.buzz/">
  <meta property="og:title" content="What's all the buzz about?">
  <meta property="og:description" content="What's all the buzz about?">
  <meta property="og:image" content="https://whats-all-the.buzz/img/vhdzwtku.png">
  <meta property="og:site_name" content="whats-all-the.buzz">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://whats-all-the.buzz/">
  <meta name="twitter:title" content="What's all the buzz about?">
  <meta name="twitter:description" content="What's all the buzz about?">
  <meta name="twitter:image" content="https://whats-all-the.buzz/img/vhdzwtku.png">

  <script>
    (function() {
      var pathname = window.location.pathname;

      // Do nothing if already on an 'about' path
      if (pathname.endsWith('/about') || pathname.endsWith('/about/')) {
        return;
      }

      // Determine the base path prefix (for github.io user site / repo subpath vs custom domain)
      var isGithubIo = window.location.hostname.endsWith('.github.io');
      var prefix = '/';

      if (isGithubIo) {
        var secondSlash = pathname.indexOf('/', 1);
        if (secondSlash !== -1) {
          prefix = pathname.substring(0, secondSlash + 1);
        } else if (pathname.length > 1) {
          prefix = pathname + '/';
        }
      }

      var target = prefix + 'about/';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/about/">/about</a>...</p>
</body>
</html>
