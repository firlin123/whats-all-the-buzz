<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's all the buzz about?</title>
  <meta name="description" content="What's all the buzz about?">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://whats-all-the.buzz/about/">
  <meta property="og:title" content="What's all the buzz about?">
  <meta property="og:description" content="What's all the buzz about?">
  <meta property="og:image" content="https://whats-all-the.buzz/img/vhdzwtku.png">
  <meta property="og:site_name" content="whats-all-the.buzz">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://whats-all-the.buzz/about/">
  <meta name="twitter:title" content="What's all the buzz about?">
  <meta name="twitter:description" content="What's all the buzz about?">
  <meta name="twitter:image" content="https://whats-all-the.buzz/img/vhdzwtku.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: linear-gradient(135deg,
          #ecd974 25%,
          #463a18 25%,
          #463a18 50%,
          #ecd974 50%,
          #ecd974 75%,
          #463a18 75%);
      background-size: 120px 120px;
      animation: moveStripes 3s linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes moveStripes {
      0% {
        background-position: 0 0;
      }

      100% {
        background-position: 120px 0;
      }
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>
  <img id="random-image" alt="Cherry Bee" referrerpolicy="no-referrer">
  <script src="../js/index.js"></script>
</body>

</html>
