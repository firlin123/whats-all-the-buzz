<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's all the buzz about?</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <img id="random-image" alt="Cherry Bee" referrerpolicy="no-referrer">

  <script>
    (function() {
      var images = [
        "../img/273798.png",
        "../img/2072824.jpg",
        "../img/2197995.png",
        "../img/2731564.png",
        "../img/3477593.png",
        "../img/3483910.png",
        "../img/3771284.png",
        "../img/3782830.png",
        "../img/3821932.png",
        "../img/vhdzwtku.png"
      ];
      var selected = images[Math.floor(Math.random() * images.length)];
      var imgEl = document.getElementById('random-image');
      if (imgEl) {
        imgEl.src = selected;
      }
    })();
  </script>
</body>
</html>
